<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="听两个连续的音，判断旋律是上行还是下行。10 题一组，训练旋律音程的高低感。">
<title>Melodic Direction</title>
<style>
:root{--bg:#f5f5f4;--card:#fff;--gold:#c27620;--gold2:#ead9b1;--text:#222;--muted:#777;--correct:#4d8a5f;--wrong:#ad4b45}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:Arial,"Microsoft YaHei",sans-serif;color:var(--text)}
.app{max-width:680px;margin:auto;padding:28px 16px 60px}.header{display:flex;align-items:center;gap:14px}.back{font-size:28px;color:#666;text-decoration:none;line-height:1}.top{flex:1}.title{font-size:23px;font-weight:700}.sub{font-size:14px;color:var(--muted);margin-top:5px}.score{font-size:14px;color:var(--muted);text-align:right;white-space:nowrap}.score b{font-size:20px;color:var(--gold)}
.progress{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:24px}.dot{height:8px;border-radius:99px;background:#dfd8ca;transition:.2s}.dot.current{background:var(--gold)}.dot.correct{background:var(--correct)}.dot.wrong{background:var(--wrong)}
.prompt{background:var(--card);border:1px solid #e5dcc6;border-radius:17px;margin-top:16px;min-height:270px;padding:27px 22px 23px;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.question{font-size:15px;color:var(--muted);margin-bottom:12px}.listen{font-size:47px;line-height:1;color:var(--gold);letter-spacing:5px}.hint{font-size:16px;color:#555;margin:18px 0 15px;min-height:24px}.replay{width:48px;height:48px;border:1px solid #d2c4aa;border-radius:50%;background:#fff;color:var(--gold);font-size:19px;cursor:pointer;transition:.15s}.replay:hover{background:#faf5eb}.replay:active{transform:scale(.94)}.replay.playing{background:var(--gold);color:#fff}
.assist-controls{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:10px}.assist-controls button{border:1px solid #d2c4aa;border-radius:8px;background:#fff;color:#666;padding:6px 10px;cursor:pointer}.assist-controls button:hover{background:#faf5eb}.assist-controls .assist-note{width:100%;font-size:12px;color:#8a765b;margin-bottom:2px}.assist-controls button.dir-up{color:#2f7650;border-color:#a9cbb5}.assist-controls button.dir-down{color:#9a4c43;border-color:#d8b2ad}
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-top:20px}.answer-pair{background:var(--card);border:1px solid #e5dcc6;border-radius:13px;padding:13px 10px;text-align:center}.pair-label{font-size:14px;font-weight:700;color:#666;margin-bottom:10px}.direction-buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}.answer{border:1px solid #d2c4aa;border-radius:9px;background:#fff;padding:10px 5px;color:#555;font:700 15px Arial,"Microsoft YaHei",sans-serif;cursor:pointer;transition:.15s}.answer small{display:block;margin-top:3px;color:#888;font-size:10px;font-weight:400}.answer:hover:not(:disabled){border-color:var(--gold);background:#faf5eb;transform:translateY(-1px)}.answer.correct{background:#dcece0;border-color:var(--correct);color:#346b43}.answer.wrong{background:#f3d8d6;border-color:var(--wrong);color:#943c37}.answer:disabled{cursor:default}
.settings{background:var(--card);border:1px solid #e5dcc6;border-radius:15px;margin-top:24px;padding:16px 17px}.settings-title{font-size:14px;font-weight:700;color:#555;margin-bottom:12px}.setting-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.setting-row label{font-size:14px;color:#555;cursor:pointer}.setting-row input{accent-color:var(--gold)}select{font:inherit;margin-left:5px;padding:7px 9px;border:1px solid #ccc;border-radius:8px;background:#fff}.volume{display:flex;align-items:center;gap:7px;font-size:14px;color:#555}.volume input{accent-color:var(--gold);width:112px}.new{margin-left:auto;padding:8px 13px;border:1px solid #d2c4aa;border-radius:8px;background:#fff;color:#555;font:inherit;cursor:pointer}.new:hover{background:#faf5eb}
.help{font-size:13px;color:var(--muted);line-height:1.6;margin:18px 3px}.footer{text-align:center;color:#aaa;font-size:12px;margin-top:24px}
@media(max-width:500px){.app{padding:18px 12px 48px}.title{font-size:20px}.prompt{min-height:240px}.setting-row{gap:11px}.new{margin-left:0}.answer{padding:16px 5px;font-size:17px}}
</style>
</head>
<body>
<main class="app">
  <div class="header">
    <a class="back" href="index.html" aria-label="返回游戏列表">←</a>
    <div class="top"><div class="title">👂 旋律音程高低判断</div><div class="sub">从听觉上建立旋律音程的上、下行感觉</div></div>
    <div class="score">得分<br><b id="score">0</b> / <span id="total">10</span></div>
  </div>
  <div class="progress" id="progress" aria-label="答题进度"></div>
  <section class="prompt">
    <div class="question" id="questionLabel">第 1 题 · 听旋律</div>
    <div class="listen" id="noteDisplay">♪ → ♪</div>
    <div class="hint" id="hint">判断每两个相邻音的上、下行方向。</div>
    <button class="replay" id="replay" title="再听一次" aria-label="再听一次">🔊</button>
    <div class="assist-controls" id="assistControls"></div>
  </section>
  <section class="answers" id="answers"></section>
  <section class="settings">
    <div class="settings-title">练习设置</div>
    <div class="setting-row">
      <label>每组题数 <select id="roundSize"><option value="10">10 题</option><option value="20">20 题</option><option value="30">30 题</option><option value="50" selected>50 题</option></select></label>
      <label>每题音符数 <select id="noteCount"><option value="2" selected>2 个音</option><option value="3">3 个音</option><option value="4">4 个音</option><option value="5">5 个音</option></select></label>
      <label>难度 <select id="difficulty"><option value="easy">简单（1–4 半音）</option><option value="medium" selected>中等（1–7 半音）</option><option value="hard">困难（1–4 半音为主）</option><option value="expert">极难（半音/全音）</option></select></label>
      <label><input type="checkbox" id="assistMode" checked> 辅助模式（逐音播放）</label>
      <label>音色 <select id="instrumentMode"><option value="random" selected>随机（全部音色）</option><option value="piano">钢琴</option><option value="guitar">吉他</option><option value="violin">小提琴</option><option value="cello">大提琴</option><option value="flute">长笛</option><option value="clarinet">单簧管</option><option value="oboe">双簧管</option><option value="trumpet">小号</option><option value="saxophone">萨克斯</option><option value="organ">管风琴</option><option value="electricPiano">电钢琴</option><option value="vibraphone">颤音琴</option><option value="marimba">马林巴</option><option value="choir">人声合唱</option><option value="synth">合成器</option></select></label>
      <label><input type="radio" name="playMode" value="once"> 只播放一次</label>
      <label><input type="radio" name="playMode" value="loop" checked> 循环播放</label>
      <label id="loopDelayControl">循环间隔 <select id="loopDelay"><option value="1" selected>1 秒</option><option value="2">2 秒</option><option value="3">3 秒</option><option value="5">5 秒</option><option value="8">8 秒</option></select></label>
      <label class="volume">音量 <input type="range" id="volume" min="0" max="250" value="150"><span id="volumeLabel">150%</span></label>
      <button class="new" id="restart">重新开始 50 题</button>
    </div>
  </section>
  <div class="help">选择 3 个音时，要分别判断 1→2 与 2→3 的走向。无需设置音程筛选；题目会随机使用从半音到两个八度的完整音程范围，包含跨到上一个或下一个八度的音。<b>只播放一次</b>模式会在出题时只播一次；<b>循环播放</b>会持续播放，直到你完成该题。</div>
  <div class="footer">Melodic interval direction · 50 questions per round</div>
</main>
<script>
let roundSize=50;
const difficultySteps={
  easy:Array.from({length:4},(_,i)=>i+1),
  medium:Array.from({length:7},(_,i)=>i+1),
  hard:[1,2,3,4,1,2,3,4,5,6,7],
  expert:[1,1,1,2,2,2,3,3,4]
};
let questions=[],index=0,score=0,locked=false,audioCtx=null,masterBus=null,loopTimer=null,playTimer=null,activeSources=[];
const instruments={
  piano:{name:'钢琴',wave:'triangle',partials:[1,.28,.12,.06],attack:.012,release:1.15,filter:7},
  guitar:{name:'吉他',wave:'triangle',partials:[1,.34,.16,.08,.03],attack:.008,release:1.45,filter:5},
  violin:{name:'小提琴',wave:'sawtooth',partials:[1,.5,.28,.16,.08],attack:.12,release:1.25,filter:8},
  cello:{name:'大提琴',wave:'sawtooth',partials:[1,.42,.2,.1,.04],attack:.1,release:1.4,filter:5},
  flute:{name:'长笛',wave:'sine',partials:[1,.18,.05],attack:.08,release:1.1,filter:3},
  clarinet:{name:'单簧管',wave:'square',partials:[1,.35,.2,.1,.05],attack:.035,release:1.1,filter:4},
  oboe:{name:'双簧管',wave:'sawtooth',partials:[1,.4,.22,.12],attack:.055,release:1.05,filter:5},
  trumpet:{name:'小号',wave:'sawtooth',partials:[1,.5,.3,.18,.1],attack:.025,release:1.05,filter:6},
  saxophone:{name:'萨克斯',wave:'sawtooth',partials:[1,.45,.25,.12,.06],attack:.045,release:1.2,filter:5},
  organ:{name:'管风琴',wave:'sine',partials:[1,.5,.3,.2,.12],attack:.06,release:1.5,filter:9},
  electricPiano:{name:'电钢琴',wave:'sine',partials:[1,.35,.16,.08],attack:.018,release:1.35,filter:6},
  vibraphone:{name:'颤音琴',wave:'sine',partials:[1,.42,.2,.1],attack:.01,release:1.8,filter:8},
  marimba:{name:'马林巴',wave:'sine',partials:[1,.2,.08],attack:.006,release:1.25,filter:5},
  choir:{name:'人声合唱',wave:'sine',partials:[1,.55,.3,.18,.1],attack:.18,release:1.35,filter:4},
  synth:{name:'合成器',wave:'square',partials:[1,.2,.1],attack:.01,release:1.1,filter:10}
};
const instrumentKeys=Object.keys(instruments);

function getCtx(){
  if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();masterBus=audioCtx.createDynamicsCompressor();masterBus.threshold.value=-24;masterBus.knee.value=24;masterBus.ratio.value=12;masterBus.attack.value=.002;masterBus.release.value=.2;masterBus.connect(audioCtx.destination)}
  if(audioCtx.state==='suspended') audioCtx.resume(); return audioCtx;
}
function midiToFreq(midi){return 440*Math.pow(2,(midi-69)/12)}
function playTone(freq,delay=0,key='piano'){
  const preset=instruments[key]||instruments.piano,ctx=getCtx(),t=ctx.currentTime+delay,volume=Number(document.getElementById('volume').value)/100;
  const gain=ctx.createGain(),filter=ctx.createBiquadFilter(),duration=preset.release;
  gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(Math.max(.0001,.52*volume),t+preset.attack);gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
  filter.type='lowpass';filter.frequency.setValueAtTime(freq*preset.filter,t);filter.frequency.exponentialRampToValueAtTime(freq*1.35,t+duration*.8);gain.connect(filter);filter.connect(masterBus);
  preset.partials.forEach((level,i)=>{const osc=ctx.createOscillator(),partial=ctx.createGain();osc.type=i===0?preset.wave:'sine';osc.frequency.setValueAtTime(freq*(i+1),t);partial.gain.value=level/(i?1.4:1);osc.connect(partial);partial.connect(gain);osc.addEventListener('ended',()=>{const n=activeSources.indexOf(osc);if(n>=0)activeSources.splice(n,1)});activeSources.push(osc);osc.start(t);osc.stop(t+duration+.05)});
}
function playGlide(fromFreq,toFreq,key='piano',delay=0,duration=.9){
  const preset=instruments[key]||instruments.piano,ctx=getCtx(),t=ctx.currentTime+delay,volume=Number(document.getElementById('volume').value)/100;
  const gain=ctx.createGain(),filter=ctx.createBiquadFilter();
  gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(Math.max(.0001,.5*volume),t+preset.attack);gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
  filter.type='lowpass';filter.frequency.setValueAtTime(fromFreq*preset.filter,t);filter.frequency.exponentialRampToValueAtTime(toFreq*preset.filter,t+duration*.8);gain.connect(filter);filter.connect(masterBus);
  preset.partials.forEach((level,i)=>{const osc=ctx.createOscillator(),partial=ctx.createGain();osc.type=i===0?preset.wave:'sine';osc.frequency.setValueAtTime(fromFreq*(i+1),t);osc.frequency.exponentialRampToValueAtTime(toFreq*(i+1),t+duration*.82);partial.gain.value=level/(i?1.4:1);osc.connect(partial);partial.connect(gain);osc.addEventListener('ended',()=>{const n=activeSources.indexOf(osc);if(n>=0)activeSources.splice(n,1)});activeSources.push(osc);osc.start(t);osc.stop(t+duration+.05)});
}
function playAssistDirection(startMidi,direction,interval,key){
  const step=direction==='up'?1:-1,scale=[];
  for(let i=0;i<=12;i++)scale.push(startMidi+step*i);
  stopAudioOnly();scale.forEach((midi,i)=>playTone(midiToFreq(midi),i*.22,key));
}
function playAssistIntro(q){
  stopPlayback();
  playTone(midiToFreq(q.notes[0]),0,q.instrument);
  if(q.notes[1]!==undefined)playTone(midiToFreq(q.notes[1]),1.15,q.instrument);
  setTimeout(()=>playAssistDirection(q.notes[0],'up',12,q.instrument),2400);
  setTimeout(()=>playAssistDirection(q.notes[0],'down',12,q.instrument),5600);
}
function stopAudioOnly(){
  if(audioCtx){const now=audioCtx.currentTime;activeSources.splice(0).forEach(source=>{try{source.stop(now)}catch(_){}})}
}
function stopPlayback(){if(loopTimer)clearTimeout(loopTimer);if(playTimer)clearTimeout(playTimer);loopTimer=null;playTimer=null;if(audioCtx){const now=audioCtx.currentTime;activeSources.splice(0).forEach(source=>{try{source.stop(now)}catch(_){}})}}
function playQuestion(manual=false,forceLoop=false){
  if(!questions[index]||index>=roundSize)return;stopPlayback();const q=questions[index],button=document.getElementById('replay'),gap=.82;
  button.classList.add('playing');q.notes.forEach((midi,i)=>playTone(midiToFreq(midi),i*gap,q.instrument));playTimer=setTimeout(()=>button.classList.remove('playing'),q.notes.length*gap*1000+180);
  if(!manual&&!forceLoop&&document.querySelector('input[name="playMode"]:checked').value==='once')button.disabled=true;
  if((document.querySelector('input[name="playMode"]:checked').value==='loop'||forceLoop)&&!locked){const wait=q.notes.length*gap*1000+Number(document.getElementById('loopDelay').value)*1000;loopTimer=setTimeout(()=>playQuestion(false,forceLoop),wait)}
}
function makeQuestions(){
  const difficulty=document.getElementById('difficulty')?.value||'medium';
  const steps=difficultySteps[difficulty]||difficultySteps.medium,count=Number(document.getElementById('noteCount').value),list=[];
  for(let i=0;i<roundSize;i++){
    const notes=[60+Math.floor(Math.random()*9)],directions=[];
    for(let n=1;n<count;n++){const step=steps[Math.floor(Math.random()*steps.length)],current=notes[n-1];let direction=Math.random()<.5?'up':'down';if(current+(direction==='up'?step:-step)<36||current+(direction==='up'?step:-step)>96)direction=direction==='up'?'down':'up';directions.push(direction);notes.push(current+(direction==='up'?step:-step))}
    const mode=document.getElementById('instrumentMode')?.value||'random';
    const instrument=mode==='random'?instrumentKeys[Math.floor(Math.random()*instrumentKeys.length)]:mode;
    list.push({notes,directions,instrument,answers:[],accepted:[],hadMistake:false});
  }
  return list;
}
function renderProgress(){
  const el=document.getElementById('progress');el.innerHTML='';for(let i=0;i<roundSize;i++){const dot=document.createElement('div');dot.className='dot';if(i===index&&index<roundSize)dot.classList.add('current');if(questions[i]?.result)dot.classList.add(questions[i].result);el.appendChild(dot)}
}
function buildAnswers(){
  const answers=document.getElementById('answers'),q=questions[index];answers.innerHTML='';q.directions.forEach((direction,pair)=>{const card=document.createElement('div');card.className='answer-pair';card.innerHTML='<div class="pair-label">第 '+(pair+1)+' 音 → 第 '+(pair+2)+' 音</div><div class="direction-buttons"><button class="answer" data-pair="'+pair+'" data-answer="up">↑ 上行<small>后音更高</small></button><button class="answer" data-pair="'+pair+'" data-answer="down">↓ 下行<small>后音更低</small></button></div>';answers.appendChild(card)});answers.querySelectorAll('.answer').forEach(b=>b.addEventListener('click',()=>answer(Number(b.dataset.pair),b.dataset.answer)))}
function showQuestion(){
  stopPlayback();locked=false;renderProgress();document.getElementById('replay').disabled=false;
  if(index>=roundSize){finishRound();return}
  const q=questions[index],count=q.notes.length;document.getElementById('questionLabel').textContent=`第 ${index+1} 题 · 听 ${count} 个连续的音`;
  document.getElementById('noteDisplay').textContent=Array(count).fill('♪').join(' → ');document.getElementById('hint').textContent='判断每两个相邻音的上、下行方向。';buildAnswers();
  const controls=document.getElementById('assistControls');controls.innerHTML='';
  if(document.getElementById('assistMode').checked){
    q.notes.slice(0,-1).forEach((_,i)=>{
      const start=q.notes[i],b=document.createElement('button');b.className='dir-up';b.textContent=`${i+1} 上下行`;b.title='依次示范上行八度和下行八度';
      b.addEventListener('click',()=>playAssistPair(start,q.instrument));controls.appendChild(b);
    });
  }
  // 无论是否开启辅助模式，进入题目都先自动播放题目旋律；
  // 辅助模式只是不自动播放上下行示范，示范由集合按钮手动触发。
  const assistOn=document.getElementById('assistMode').checked;
  const playMode=document.querySelector('input[name="playMode"]:checked').value;
  if(!assistOn||playMode==='loop')setTimeout(()=>playQuestion(),250);
}
function playAssistPair(startMidi,key){
  // Pause the question loop while the hint is playing, then resume it.
  stopPlayback();
  playAssistDirection(startMidi,'up',12,key);
  setTimeout(()=>playAssistDirection(startMidi,'down',12,key),3200);
  if(document.querySelector('input[name="playMode"]:checked').value==='loop'&&!locked){
    loopTimer=setTimeout(()=>playQuestion(),7000);
  }
}
function answer(pair,choice){
  if(locked||index>=roundSize)return;const q=questions[index],correctDirection=q.directions[pair];if(q.accepted[pair])return;
  const buttons=document.querySelectorAll('.answer[data-pair="'+pair+'"]');
  if(choice!==correctDirection){
    q.hadMistake=true;q.answers[pair]=choice;buttons.forEach(b=>{if(b.dataset.answer===choice){b.disabled=true;b.classList.add('wrong')}if(b.dataset.answer===correctDirection){b.classList.add('correct');b.disabled=false}});
    document.getElementById('replay').disabled=false;playQuestion(false,true);return;
  }
  q.accepted[pair]=true;q.answers[pair]=choice;buttons.forEach(b=>{b.disabled=true;if(b.dataset.answer===correctDirection)b.classList.add('correct')});
  if(q.accepted.filter(Boolean).length<q.directions.length)return;
  locked=true;stopPlayback();q.result=q.hadMistake?'wrong':'correct';if(!q.hadMistake)score++;document.getElementById('score').textContent=score;renderProgress();setTimeout(()=>{index++;showQuestion()},900);
}
function finishRound(){
  locked=true;renderProgress();document.querySelectorAll('.answer').forEach(b=>b.disabled=true);document.getElementById('questionLabel').textContent='本组完成！';document.getElementById('hint').textContent=`你答对了 ${score} / ${roundSize} 题`;
}
function restart(){stopPlayback();roundSize=Number(document.getElementById('roundSize').value);questions=makeQuestions();index=0;score=0;locked=false;document.getElementById('score').textContent='0';document.getElementById('total').textContent=roundSize;showQuestion()}
document.getElementById('replay').addEventListener('click',()=>playQuestion(true));document.getElementById('restart').addEventListener('click',restart);document.getElementById('noteCount').addEventListener('change',restart);document.getElementById('difficulty').addEventListener('change',restart);document.getElementById('roundSize').addEventListener('change',restart);document.getElementById('instrumentMode').addEventListener('change',restart);document.getElementById('assistMode').addEventListener('change',showQuestion);document.querySelectorAll('input[name="playMode"]').forEach(b=>b.addEventListener('change',restart));document.getElementById('loopDelay').addEventListener('change',()=>{if(document.querySelector('input[name="playMode"]:checked').value==='loop')playQuestion()});document.getElementById('volume').addEventListener('input',e=>document.getElementById('volumeLabel').textContent=e.target.value+'%');
restart();
</script>
</body>
</html>

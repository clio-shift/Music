<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="听两个同时响起的音，识别和声音程。可选择练习范围与题数。">
<title>听和声 — Harmonic Interval Ear Training</title>
<style>
:root{--bg:#f5f5f4;--card:#fff;--gold:#c27620;--line:#e5dcc6;--text:#222;--muted:#777;--ok:#4d8a5f;--bad:#ad4b45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif}.app{max-width:680px;margin:auto;padding:28px 16px 60px}.header{display:flex;align-items:center;gap:14px}.back{font-size:28px;color:#666;text-decoration:none}.top{flex:1}.title{font-size:23px;font-weight:700}.sub{font-size:14px;color:var(--muted);margin-top:5px}.score{font-size:14px;color:var(--muted);text-align:right}.score b{font-size:20px;color:var(--gold)}.progress{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:24px}.dot{height:8px;border-radius:99px;background:#dfd8ca}.dot.current{background:var(--gold)}.dot.correct{background:var(--ok)}.dot.wrong{background:var(--bad)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:16px;padding:24px 16px;text-align:center;box-shadow:0 1px 3px #0000000a}.question{font-size:15px;color:var(--muted);margin-bottom:12px}.symbol{font-size:50px;color:var(--gold);line-height:1}.hint{margin:17px 0;color:#555}.play{width:52px;height:52px;border:1px solid #d2c4aa;border-radius:50%;background:#fff;font-size:19px;cursor:pointer}.play:hover{background:#faf5eb}.play.playing{background:var(--gold);color:#fff}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:20px}.answer{padding:12px 5px;border:1px solid #d2c4aa;border-radius:9px;background:#fff;color:#555;font:700 14px Arial,"Microsoft YaHei",sans-serif;cursor:pointer}.answer small{display:block;font-size:10px;color:#888;font-weight:400;margin-top:3px}.answer:hover:not(:disabled){border-color:var(--gold);background:#faf5eb}.answer.correct{background:#dcece0;border-color:var(--ok);color:#346b43}.answer.wrong{background:#f3d8d6;border-color:var(--bad);color:#943c37}.settings{text-align:left}.settings-title{font-size:14px;font-weight:700;color:#555;margin-bottom:12px}.row{display:flex;align-items:center;gap:13px;flex-wrap:wrap}.row label{font-size:14px;color:#555}select,input,button{font:inherit}select{margin-left:4px;padding:7px 8px;border:1px solid #ccc;border-radius:8px;background:#fff}.volume{display:flex;align-items:center;gap:6px}.volume input{width:105px;accent-color:var(--gold)}.new{margin-left:auto;padding:8px 13px;border:1px solid #d2c4aa;border-radius:8px;background:#fff;color:#555;cursor:pointer}.help{font-size:13px;color:var(--muted);line-height:1.65;margin:17px 3px}.footer{text-align:center;color:#aaa;font-size:12px;margin-top:24px}@media(max-width:500px){.app{padding:18px 12px 48px}.answers{grid-template-columns:repeat(2,1fr)}.new{margin-left:0}}
</style>
</head>
<body><main class="app">
  <div class="header"><a class="back" href="index.html" aria-label="返回游戏列表">←</a><div class="top"><div class="title">🎹 听和声</div><div class="sub">听两个同时响起的音，判断它们构成的音程</div></div><div class="score">得分<br><b id="score">0</b> / <span id="total">10</span></div></div>
  <div class="progress" id="progress"></div>
  <section class="card"><div class="question" id="question">第 1 题 · 听和声音程</div><div class="symbol">♫ ♫</div><div class="hint" id="hint">两个音会同时响起，选出你听到的音程。</div><button class="play" id="play" aria-label="播放和声" title="再听一次">🔊</button></section>
  <section class="answers" id="answers"></section>
  <section class="card settings"><div class="settings-title">练习设置</div><div class="row"><label>每组题数 <select id="round"><option value="10" selected>10 题</option><option value="20">20 题</option><option value="30">30 题</option><option value="50">50 题</option></select></label><label>练习范围 <select id="level"><option value="easy">容易：三、五、八度</option><option value="normal" selected>普通：二度到八度</option><option value="all">进阶：含增减音程</option></select></label><label class="volume">音量 <input id="volume" type="range" min="0" max="180" value="100"><span id="volumeLabel">100%</span></label><button class="new" id="restart">重新开始 10 题</button></div></section>
  <div class="help">和声是指两个音<strong>同时</strong>响起。先留意声音是融合、紧张还是空旷，再辨认音程。答错后可再听一次；答对后自动进入下一题。</div><div class="footer">Harmonic interval ear training</div>
</main><script>
const intervals=[{s:1,n:'小二度',t:'紧张'},{s:2,n:'大二度',t:'紧张'},{s:3,n:'小三度',t:'柔和'},{s:4,n:'大三度',t:'明亮'},{s:5,n:'纯四度',t:'空旷'},{s:6,n:'三全音',t:'不稳定'},{s:7,n:'纯五度',t:'稳定'},{s:8,n:'小六度',t:'柔和'},{s:9,n:'大六度',t:'明亮'},{s:10,n:'小七度',t:'张力'},{s:11,n:'大七度',t:'张力'},{s:12,n:'纯八度',t:'融合'}];
let roundSize=10,questions=[],index=0,score=0,locked=false,ctx,bus,timer;
const $=id=>document.getElementById(id);function getCtx(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();bus=ctx.createDynamicsCompressor();bus.threshold.value=-22;bus.ratio.value=10;bus.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume();return ctx}function freq(m){return 440*Math.pow(2,(m-69)/12)}
function tone(m,when){const c=getCtx(),g=c.createGain(),o=c.createOscillator(),f=c.createBiquadFilter(),v=Number($('volume').value)/100;g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(.22*v,when+.02);g.gain.exponentialRampToValueAtTime(.0001,when+1.35);o.type='triangle';o.frequency.value=freq(m);f.type='lowpass';f.frequency.value=freq(m)*5;o.connect(f);f.connect(g);g.connect(bus);o.start(when);o.stop(when+1.4)}
function play(){if(!questions[index]||locked)return;clearTimeout(timer);const c=getCtx(),q=questions[index];$('play').classList.add('playing');tone(q.root,c.currentTime);tone(q.root+q.interval.s,c.currentTime);timer=setTimeout(()=>$('play').classList.remove('playing'),1450)}
function pool(){const level=$('level').value;if(level==='easy')return intervals.filter(x=>[3,4,7,12].includes(x.s));if(level==='normal')return intervals.filter(x=>x.s!==1&&x.s!==6&&x.s!==11);return intervals}
function make(){const p=pool();return Array.from({length:roundSize},()=>({root:52+Math.floor(Math.random()*17),interval:p[Math.floor(Math.random()*p.length)]}))}
function progress(){const e=$('progress');e.innerHTML='';for(let i=0;i<roundSize;i++){const d=document.createElement('div');d.className='dot'+(i===index?' current':'')+(questions[i]?.result?' '+questions[i].result:'');e.appendChild(d)}}
function choices(){const q=questions[index],p=pool(),items=[q.interval];while(items.length<Math.min(6,p.length)){const x=p[Math.floor(Math.random()*p.length)];if(!items.includes(x))items.push(x)}items.sort(()=>Math.random()-.5);const e=$('answers');e.innerHTML='';items.forEach(x=>{const b=document.createElement('button');b.className='answer';b.innerHTML=x.n+'<small>'+x.t+'</small>';b.onclick=()=>answer(x,b);e.appendChild(b)})}
function show(){locked=false;if(index>=roundSize){$('question').textContent='本组完成！';$('hint').textContent=`你答对了 ${score} / ${roundSize} 题`;$('answers').innerHTML='';$('play').disabled=true;progress();return}$('play').disabled=false;$('question').textContent=`第 ${index+1} 题 · 听和声音程`;$('hint').textContent='两个音会同时响起，选出你听到的音程。';progress();choices();setTimeout(play,250)}
function answer(x,b){if(locked)return;const q=questions[index];if(x!==q.interval){b.disabled=true;b.classList.add('wrong');$('hint').textContent='再听一次，感受两个音之间的距离。';return}locked=true;q.result='correct';score++;$('score').textContent=score;document.querySelectorAll('.answer').forEach(a=>{a.disabled=true;if(a===b)a.classList.add('correct')});progress();setTimeout(()=>{index++;show()},850)}
function restart(){roundSize=Number($('round').value);questions=make();index=0;score=0;$('score').textContent='0';$('total').textContent=roundSize;$('restart').textContent=`重新开始 ${roundSize} 题`;show()}$('play').onclick=play;$('restart').onclick=restart;$('round').onchange=restart;$('level').onchange=restart;$('volume').oninput=e=>$('volumeLabel').textContent=e.target.value+'%';restart();
</script></body></html>

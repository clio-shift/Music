<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音叉台 · 视唱音准练习</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#14110f;
    --bg-1:#1c1814;
    --bg-2:#241f1a;
    --line:#3a332b;
    --brass:#d9a44e;
    --brass-dim:#8a6a37;
    --voice:#5fcfc2;
    --voice-dim:#2f5f59;
    --cream:#efe8db;
    --cream-dim:#a89c88;
    --good:#7fbf6a;
    --warn:#d9a44e;
    --bad:#c2604a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg-0);
    color:var(--cream);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:28px 20px 60px;
  }
  .wrap{max-width:920px;margin:0 auto;}
  header{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
  header svg{flex:none;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    margin:0;
    letter-spacing:.2px;
  }
  .sub{color:var(--cream-dim);font-size:13.5px;margin:2px 0 0;}
  .panel{
    background:var(--bg-1);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 20px;
    margin-top:20px;
  }
  .gate{text-align:center;padding:40px 20px;}
  .gate p{color:var(--cream-dim);font-size:14px;max-width:440px;margin:10px auto 22px;line-height:1.6;}
  button.primary{
    background:var(--brass);
    color:#26190a;
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    padding:12px 26px;
    border-radius:10px;
    cursor:pointer;
  }
  button.primary:hover{background:#e6b465;}
  .err{color:var(--bad);font-size:13px;margin-top:14px;}
  .hidden{display:none !important;}

  .topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .range-select{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--cream-dim);}
  select{
    background:var(--bg-2);
    color:var(--cream);
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 10px;
    font-family:'Inter',sans-serif;
    font-size:13px;
  }
  button.ghost{
    background:transparent;
    border:1px solid var(--line);
    color:var(--cream-dim);
    padding:7px 14px;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  button.ghost:hover{border-color:var(--brass-dim);color:var(--cream);}

  .grid-area{position:relative;}
  canvas#chart{width:100%;display:block;border-radius:10px;background:var(--bg-0);}
  .legend{display:flex;gap:18px;margin-top:10px;font-size:12.5px;color:var(--cream-dim);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

  .readout{
    display:flex;
    gap:16px;
    margin-top:18px;
    flex-wrap:wrap;
  }
  .card{
    background:var(--bg-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 16px;
    flex:1;
    min-width:150px;
  }
  .card .label{font-size:11.5px;color:var(--cream-dim);text-transform:uppercase;letter-spacing:.06em;}
  .card .val{font-family:'IBM Plex Mono',monospace;font-size:20px;margin-top:4px;}
  .card .sub2{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--cream-dim);margin-top:2px;}

  .meter-wrap{display:flex;flex-direction:column;align-items:center;min-width:190px;}
  .meter-wrap svg{overflow:visible;}
  #needle{transform-origin:100px 92px;transition:transform .08s ease-out;}
  .match-label{font-size:13px;margin-top:6px;font-weight:600;font-family:'IBM Plex Mono',monospace;}

  .keyboard-wrap{margin-top:22px;}
  .keyboard-scroll{overflow-x:auto;padding-bottom:8px;scrollbar-color:var(--brass-dim) var(--bg-2);}
  .keyboard{
    position:relative;
    height:132px;
    width:1456px;
    min-width:1456px;
    background:var(--bg-2);
    border-radius:8px;
    border:1px solid var(--line);
  }
  .keyboard-hint{font-size:11.5px;color:var(--cream-dim);margin:0 0 7px;}
  .mic-select{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--cream-dim);min-width:0;}
  .mic-select select{max-width:260px;}
  @media(max-width:640px){.mic-select{width:100%;}.mic-select select{max-width:none;min-width:0;flex:1;}}
  .wkey, .bkey{
    position:absolute;
    top:0;
    height:100%;
    border-radius:0 0 6px 6px;
    cursor:pointer;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:6px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    user-select:none;
    transition:background .08s;
  }
  .wkey{
    background:#e8e0d0;
    color:#6b5a3d;
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    z-index:1;
  }
  .wkey:first-child{border-left:none;}
  .wkey.active{background:var(--brass);}
  .bkey{
    background:#1b1712;
    color:#c9bfa8;
    height:62%;
    border:1px solid #000;
    z-index:2;
  }
  .bkey.active{background:var(--brass-dim);}
  .listen-dot{
    width:10px;height:10px;border-radius:50%;
    background:#4a4238;
    display:inline-block;
    margin-right:6px;
    transition:background .1s;
  }
  .listen-dot.on{background:var(--voice);}
  .status-line{font-size:12.5px;color:var(--cream-dim);margin-top:10px;display:flex;align-items:center;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
      <path d="M9 4 V16 A8 8 0 0 0 25 16 V4" stroke="#d9a44e" stroke-width="2.4" fill="none"/>
      <line x1="17" y1="16" x2="17" y2="30" stroke="#d9a44e" stroke-width="2.4"/>
      <line x1="12" y1="30" x2="22" y2="30" stroke="#d9a44e" stroke-width="2.4"/>
    </svg>
    <div>
      <h1>音叉台</h1>
      <p class="sub">点一个音，听参考音高；跟着模唱，看看你的音线落在同一条水平线上没有</p>
    </div>
  </header>

  <div class="panel gate" id="gate">
    <p>需要用到麦克风来实时检测你的演唱音高。点击下面的按钮授权麦克风，并进入练习。</p>
    <button class="primary" id="startBtn">开启麦克风，开始练习</button>
    <p class="err hidden" id="errMsg"></p>
  </div>

  <div class="panel hidden" id="main">
    <div class="topbar">
      <div class="range-select">
        音域范围
        <select id="rangeSelect">
          <option value="low">低音（男低音，C2–C4）</option>
          <option value="mid" selected>中音（男高音/女中音，C3–C5）</option>
          <option value="small1">小字一组（C4–B4）</option>
          <option value="high">高音（女高音，C4–C6）</option>
          <option value="full">钢琴全音域（A0–C8）</option>
        </select>
      </div>
      <div class="mic-select">
        麦克风
        <select id="micSelect" aria-label="选择麦克风"><option value="">默认麦克风</option></select>
      </div>
      <button class="ghost" id="clearBtn">清空图表</button>
    </div>

    <div class="grid-area">
      <canvas id="chart" height="380"></canvas>
    </div>
    <div class="legend">
      <span><i class="dot" style="background:var(--brass)"></i>参考音（点击琴键播放）</span>
      <span><i class="dot" style="background:var(--voice)"></i>你的演唱音高</span>
    </div>

    <div class="readout">
      <div class="card">
        <div class="label">目标音</div>
        <div class="val" id="targetNote">—</div>
        <div class="sub2" id="targetHz">点击琴键选一个音</div>
      </div>
      <div class="card">
        <div class="label">你的音高</div>
        <div class="val" id="userNote">—</div>
        <div class="sub2" id="userHz">&nbsp;</div>
      </div>
      <div class="card meter-wrap">
        <svg width="200" height="110" viewBox="0 0 200 110">
          <path d="M14 92 A86 86 0 0 1 186 92" stroke="#3a332b" stroke-width="8" fill="none"/>
          <path d="M78 22 A86 86 0 0 1 122 22" stroke="var(--good)" stroke-width="8" fill="none" opacity="0.55"/>
          <line x1="100" y1="92" x2="100" y2="14" id="needle" stroke="var(--brass)" stroke-width="3" stroke-linecap="round"/>
          <circle cx="100" cy="92" r="4.5" fill="var(--brass)"/>
          <text x="14" y="106" fill="#a89c88" font-size="10" font-family="IBM Plex Mono">-50¢</text>
          <text x="94" y="106" fill="#a89c88" font-size="10" font-family="IBM Plex Mono">0</text>
          <text x="168" y="106" fill="#a89c88" font-size="10" font-family="IBM Plex Mono">+50¢</text>
        </svg>
        <div class="match-label" id="matchLabel">—</div>
      </div>
    </div>

    <div class="status-line"><span class="listen-dot" id="listenDot"></span><span id="statusText">等待开始演唱…</span></div>
    <div style="margin-top:8px;">
      <div style="font-size:11.5px;color:var(--cream-dim);margin-bottom:4px;">麦克风输入电平（用来确认是否收到声音）</div>
      <div style="background:var(--bg-2);border:1px solid var(--line);border-radius:6px;height:10px;overflow:hidden;">
        <div id="levelBar" style="height:100%;width:0%;background:var(--voice);transition:width .05s;"></div>
      </div>
    </div>

    <div class="keyboard-wrap">
      <div class="keyboard-hint">标准钢琴 88 键（A0–C8）· 可横向滚动 · 点击任意琴键播放参考音</div>
      <div class="keyboard-scroll" id="keyboardScroll">
        <div class="keyboard" id="keyboard"></div>
      </div>
    </div>
  </div>
</div>

<script>
let audioCtx, analyser, micSource, micStream, silentGain, dataArray, sampleRate;
let startTime = 0;
let referenceSegments = [];
let userPoints = [];
let target = null;
let currentUserFreq = null;
let rafId = null;

// Pitch stabilization state: reject one-frame octave jumps without hiding real note changes.
let rawMidiHistory = [];
let stableMidi = null;
let pendingJumpMidi = null;
let pendingJumpFrames = 0;
let lastVoicedTime = -Infinity;
const PITCH_HISTORY_SIZE = 7;
const MIN_PITCH_CLARITY = 0.46;
const BIG_JUMP_CENTS = 360;
const PENDING_MATCH_CENTS = 140;
const CONFIRM_JUMP_FRAMES = 2;
const SILENCE_RESET_SECONDS = 0.30;
const BRIDGE_GAP_SECONDS = 0.16;
const HOLD_LEVEL_RMS = 0.0020;

const RANGE_PRESETS = { low:[36,60], mid:[48,72], small1:[60,71], high:[60,84], full:[21,108] };
const KEYBOARD_RANGE = [21,108]; // 标准 88 键：A0–C8
let currentRange = RANGE_PRESETS.mid;
const WINDOW_SECONDS = 8;

const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

function isWhite(midi){ const n = ((midi%12)+12)%12; return [0,2,4,5,7,9,11].includes(n); }

function midiToFreq(midi){ return 440*Math.pow(2,(midi-69)/12); }

function freqToMidi(freq){ return 69+12*Math.log2(freq/440); }

function noteNameFromMidi(midi){
  const r = Math.round(midi);
  const n = NOTE_NAMES[((r%12)+12)%12];
  const oct = Math.floor(r/12)-1;
  return n+oct;
}

const gate = document.getElementById('gate');
const mainPanel = document.getElementById('main');
const startBtn = document.getElementById('startBtn');
const errMsg = document.getElementById('errMsg');
const rangeSelect = document.getElementById('rangeSelect');
const micSelect = document.getElementById('micSelect');
const levelBar = document.getElementById('levelBar');
const clearBtn = document.getElementById('clearBtn');
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
const targetNoteEl = document.getElementById('targetNote');
const targetHzEl = document.getElementById('targetHz');
const userNoteEl = document.getElementById('userNote');
const userHzEl = document.getElementById('userHz');
const needle = document.getElementById('needle');
const matchLabel = document.getElementById('matchLabel');
const listenDot = document.getElementById('listenDot');
const statusText = document.getElementById('statusText');
const keyboardEl = document.getElementById('keyboard');
const keyboardScroll = document.getElementById('keyboardScroll');

async function connectMic(deviceId=''){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    throw new Error('当前页面无法使用 getUserMedia。请使用 HTTPS 或 localhost 打开此页面');
  }
  if(micStream) micStream.getTracks().forEach(t=>t.stop());
  if(micSource) try{ micSource.disconnect(); }catch(_){}
  if(analyser) try{ analyser.disconnect(); }catch(_){}
  if(silentGain) try{ silentGain.disconnect(); }catch(_){}

  const audioConstraints = {
    echoCancellation:false,
    noiseSuppression:false,
    autoGainControl:false,
    channelCount:1
  };
  if(deviceId) audioConstraints.deviceId = {exact:deviceId};

  micStream = await navigator.mediaDevices.getUserMedia({audio:audioConstraints});
  micSource = audioCtx.createMediaStreamSource(micStream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 8192; // 再增加分析窗口，低音区（如 C4/D4 及以下）更稳定
  analyser.smoothingTimeConstant = 0;
  sampleRate = audioCtx.sampleRate;
  dataArray = new Float32Array(analyser.fftSize);
  micSource.connect(analyser);

  // 某些浏览器会对“没有输出目的地”的音频图做节流。接一个静音输出可保持分析链稳定，又不会产生回授。
  silentGain = audioCtx.createGain();
  silentGain.gain.value = 0;
  analyser.connect(silentGain);
  silentGain.connect(audioCtx.destination);
}

async function refreshMicList(){
  if(!navigator.mediaDevices?.enumerateDevices) return;
  const previous = micSelect.value;
  const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');
  micSelect.innerHTML = '';
  devices.forEach((d,i)=>{
    const opt=document.createElement('option');
    opt.value=d.deviceId;
    opt.textContent=d.label || ('麦克风 '+(i+1));
    micSelect.appendChild(opt);
  });
  if(!devices.length){
    const opt=document.createElement('option'); opt.value=''; opt.textContent='未发现麦克风'; micSelect.appendChild(opt);
  }else if(devices.some(d=>d.deviceId===previous)){
    micSelect.value=previous;
  }
}

startBtn.addEventListener('click', async () => {
  try{
    errMsg.classList.add('hidden');
    audioCtx = new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
    if(audioCtx.state==='suspended') await audioCtx.resume();
    await connectMic();
    await refreshMicList();
    gate.classList.add('hidden');
    mainPanel.classList.remove('hidden');
    startTime = audioCtx.currentTime;
    buildKeyboard();
    resizeCanvas();
    loop();
  }catch(e){
    errMsg.textContent = '无法访问麦克风：'+e.message+'（请确认浏览器选择了正确的输入设备，并使用 HTTPS/localhost 打开）';
    errMsg.classList.remove('hidden');
  }
});

micSelect.addEventListener('change', async()=>{
  if(!audioCtx) return;
  try{
    statusText.textContent='正在切换麦克风…';
    await connectMic(micSelect.value);
    await refreshMicList();
    statusText.textContent='麦克风已切换，等待开始演唱…';
  }catch(e){
    statusText.textContent='切换麦克风失败：'+e.message;
  }
});

rangeSelect.addEventListener('change', () => {
  currentRange = RANGE_PRESETS[rangeSelect.value];
});

clearBtn.addEventListener('click', () => {
  referenceSegments = [];
  userPoints = [];
  rawMidiHistory = [];
  stableMidi = null;
  pendingJumpMidi = null;
  pendingJumpFrames = 0;
});

function resizeCanvas(){
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio||1;
  canvas.width = rect.width*dpr;
  canvas.height = 380*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resizeCanvas);

function buildKeyboard(){
  keyboardEl.innerHTML = '';
  const [minMidi,maxMidi] = KEYBOARD_RANGE;
  const whites = [];
  for(let m=minMidi;m<=maxMidi;m++){ if(isWhite(m)) whites.push(m); }
  const whiteKeyWidth = 28;
  keyboardEl.style.width = (whites.length*whiteKeyWidth)+'px';
  keyboardEl.style.minWidth = keyboardEl.style.width;
  const wPct = 100/whites.length;
  whites.forEach((m,i)=>{
    const el = document.createElement('div');
    el.className='wkey';
    el.style.left=(i*wPct)+'%';
    el.style.width=wPct+'%';
    el.dataset.midi=m;
    el.textContent=noteNameFromMidi(m);
    el.title=noteNameFromMidi(m)+' · '+midiToFreq(m).toFixed(1)+' Hz';
    el.addEventListener('click', ()=>pressKey(m,el));
    keyboardEl.appendChild(el);
  });
  const blacks = [];
  for(let m=minMidi;m<=maxMidi;m++){ if(!isWhite(m)) blacks.push(m); }
  const bPct = wPct*0.62;
  blacks.forEach(m=>{
    const countBefore = whites.filter(w=>w<m).length;
    const el = document.createElement('div');
    el.className='bkey';
    el.style.left=(countBefore*wPct - bPct/2)+'%';
    el.style.width=bPct+'%';
    el.dataset.midi=m;
    el.title=noteNameFromMidi(m)+' · '+midiToFreq(m).toFixed(1)+' Hz';
    el.addEventListener('click', ()=>pressKey(m,el));
    keyboardEl.appendChild(el);
  });

  // 初始把最常用的 C4 附近放到视野中央。
  requestAnimationFrame(()=>{
    if(!keyboardScroll) return;
    const c4 = keyboardEl.querySelector('[data-midi="60"]');
    if(c4) keyboardScroll.scrollLeft = Math.max(0, c4.offsetLeft - keyboardScroll.clientWidth/2 + c4.offsetWidth/2);
  });
}


function pressKey(midi, el){
  el.classList.add('active');
  if(midi < currentRange[0] || midi > currentRange[1]){
    rangeSelect.value='full';
    currentRange=RANGE_PRESETS.full;
  }
  setTimeout(()=>el.classList.remove('active'),240);
  const freq = midiToFreq(midi);
  playTone(freq, 1.3);
  const t = audioCtx.currentTime - startTime;
  referenceSegments.push({start:t, end:t+1.3, freq});
  target = {freq, midi, name:noteNameFromMidi(midi)};
  targetNoteEl.textContent = target.name;
  targetHzEl.textContent = freq.toFixed(1)+' Hz';
}

function playTone(freq, duration){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type='sine';
  osc.frequency.value=freq;
  const now = audioCtx.currentTime;
  gain.gain.setValueAtTime(0,now);
  gain.gain.linearRampToValueAtTime(0.28, now+0.04);
  gain.gain.setValueAtTime(0.28, now+duration-0.15);
  gain.gain.linearRampToValueAtTime(0, now+duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now+duration+0.02);
}

function autoCorrelate(buf, sr){
  const SIZE = buf.length;
  let rms=0;
  const energyPrefix = new Float64Array(SIZE+1);
  for(let i=0;i<SIZE;i++){
    const v=buf[i];
    rms += v*v;
    energyPrefix[i+1]=energyPrefix[i]+v*v;
  }
  rms = Math.sqrt(rms/SIZE);
  if(rms < 0.0022) return null;

  // Normalized autocorrelation reduces amplitude/lag bias and gives us a
  // useful confidence score for rejecting uncertain frames.
  const minLag = Math.max(2, Math.floor(sr/1200));
  const maxLag = Math.min(SIZE-2, Math.floor(sr/55));
  const corr = new Float32Array(maxLag+1);
  let bestLag=-1, bestCorr=-1;

  for(let lag=minLag; lag<=maxLag; lag++){
    const n=SIZE-lag;
    let cross=0;
    for(let i=0;i<n;i++) cross += buf[i]*buf[i+lag];
    const e1=energyPrefix[n];
    const e2=energyPrefix[SIZE]-energyPrefix[lag];
    const denom=Math.sqrt(e1*e2)+1e-12;
    const c=cross/denom;
    corr[lag]=c;
    if(c>bestCorr){ bestCorr=c; bestLag=lag; }
  }

  if(bestLag<=minLag || bestLag>=maxLag || bestCorr<MIN_PITCH_CLARITY) return null;

  const x1=corr[bestLag-1], x2=corr[bestLag], x3=corr[bestLag+1];
  const denom=(x1 - 2*x2 + x3);
  let refined=bestLag;
  if(Math.abs(denom)>1e-9){
    const delta=0.5*(x1-x3)/denom;
    if(Math.abs(delta)<=1) refined=bestLag+delta;
  }
  const freq=sr/refined;
  if(!Number.isFinite(freq) || freq<45 || freq>1800) return null;
  return {freq, clarity:bestCorr, rms};
}

function median(values){
  const a=[...values].sort((x,y)=>x-y);
  const mid=Math.floor(a.length/2);
  return a.length%2 ? a[mid] : (a[mid-1]+a[mid])/2;
}

function stabilizePitch(freq, clarity, t){
  if(!(freq>0) || clarity<MIN_PITCH_CLARITY) return null;
  const rawMidi=freqToMidi(freq);
  if(!Number.isFinite(rawMidi)) return null;

  // After a real pause, don't force the new note to remain near the previous one.
  if(t-lastVoicedTime>SILENCE_RESET_SECONDS){
    rawMidiHistory=[];
    stableMidi=null;
    pendingJumpMidi=null;
    pendingJumpFrames=0;
  }
  lastVoicedTime=t;

  rawMidiHistory.push(rawMidi);
  if(rawMidiHistory.length>PITCH_HISTORY_SIZE) rawMidiHistory.shift();
  const med=median(rawMidiHistory);

  if(stableMidi===null){
    stableMidi=med;
    return midiToFreq(stableMidi);
  }

  const jumpCents=(med-stableMidi)*100;
  if(Math.abs(jumpCents)<=BIG_JUMP_CENTS){
    // Gentle smoothing keeps vibrato and ordinary intonation movement visible.
    stableMidi = stableMidi*0.58 + med*0.42;
    pendingJumpMidi=null;
    pendingJumpFrames=0;
    return midiToFreq(stableMidi);
  }

  // A large jump must survive several consecutive frames before we accept it.
  // One-frame D4→D5→D4 octave errors are therefore discarded, while a real
  // leap to another note appears after a tiny confirmation gap.
  if(pendingJumpMidi!==null && Math.abs((med-pendingJumpMidi)*100)<=PENDING_MATCH_CENTS){
    pendingJumpMidi = pendingJumpMidi*0.5 + med*0.5;
    pendingJumpFrames++;
  }else{
    pendingJumpMidi=med;
    pendingJumpFrames=1;
  }

  if(pendingJumpFrames>=CONFIRM_JUMP_FRAMES){
    stableMidi=pendingJumpMidi;
    pendingJumpMidi=null;
    pendingJumpFrames=0;
    rawMidiHistory=[stableMidi];
    return midiToFreq(stableMidi);
  }
  return null;
}

function loop(){
  rafId = requestAnimationFrame(loop);
  if(!analyser || !dataArray) return;
  analyser.getFloatTimeDomainData(dataArray);

  let rms=0;
  for(let i=0;i<dataArray.length;i++) rms += dataArray[i]*dataArray[i];
  rms=Math.sqrt(rms/dataArray.length);
  const levelPct=Math.min(100, Math.max(0, rms*700));
  levelBar.style.width=levelPct.toFixed(1)+'%';

  const pitch = autoCorrelate(dataArray, sampleRate);
  const t = audioCtx.currentTime - startTime;
  const detectedFreq = pitch ? stabilizePitch(pitch.freq, pitch.clarity, t) : null;
  let freq = detectedFreq;
  let held = false;

  // Bridge very short detector dropouts so sustained notes do not appear dashed.
  // We only hold the last stable pitch for a tiny moment and only when input level
  // is still present, so ordinary pauses and real note changes remain visible.
  if((!freq || !(freq>45 && freq<1800)) && stableMidi!==null && (t-lastVoicedTime)<=BRIDGE_GAP_SECONDS && rms>=HOLD_LEVEL_RMS){
    freq = midiToFreq(stableMidi);
    held = true;
  }

  if(freq && freq>45 && freq<1800){
    currentUserFreq = freq;
    userPoints.push({t, freq, held});
    listenDot.classList.add('on');
    statusText.textContent = held ? '正在检测你的音高…' : '正在检测你的音高…';
    const midi = freqToMidi(freq);
    userNoteEl.textContent = noteNameFromMidi(midi);
    userHzEl.textContent = freq.toFixed(1)+' Hz';
    if(target){
      const cents = (midi - target.midi)*100;
      updateMeter(cents);
    }
  }else{
    currentUserFreq = null;
    userPoints.push({t, freq:null});
    listenDot.classList.remove('on');
    statusText.textContent = pitch ? '正在确认音高…' : '等待开始演唱…';
    userNoteEl.textContent='—';
    userHzEl.textContent='';
    updateMeter(null);
  }

  const cutoff = t - WINDOW_SECONDS - 1;
  while(userPoints.length && userPoints[0].t < cutoff) userPoints.shift();
  referenceSegments = referenceSegments.filter(s=>s.end > cutoff);

  draw(t);
}

function updateMeter(cents){
  if(cents===null){
    needle.setAttribute('transform','rotate(0 100 92)');
    matchLabel.textContent='—';
    matchLabel.style.color='var(--cream-dim)';
    return;
  }
  const clamped = Math.max(-50, Math.min(50, cents));
  const angle = clamped*1.6;
  needle.setAttribute('transform', 'rotate('+angle+' 100 92)');
  const abs = Math.abs(cents);
  if(abs<15){ matchLabel.textContent='音准很好'; matchLabel.style.color='var(--good)'; }
  else if(abs<35){ matchLabel.textContent = (cents>0?'偏高':'偏低')+' 一点'; matchLabel.style.color='var(--warn)'; }
  else{ matchLabel.textContent = (cents>0?'明显偏高':'明显偏低'); matchLabel.style.color='var(--bad)'; }
}

function midiToY(midi, minMidi, maxMidi, h){
  return h*(maxMidi-midi)/(maxMidi-minMidi);
}

function draw(nowT){
  const w = canvas.getBoundingClientRect().width;
  const h = 380;
  ctx.clearRect(0,0,w,h);

  const [minMidi,maxMidi] = currentRange;
  const padTop=10, padBottom=10;
  const plotH = h-padTop-padBottom;

  ctx.font='11px IBM Plex Mono, monospace';
  for(let m=minMidi;m<=maxMidi;m++){
    if(!isWhite(m)) continue;
    const y = padTop + midiToY(m,minMidi,maxMidi,plotH);
    const isC = m%12===0;
    ctx.strokeStyle = isC ? '#4a4238' : '#2a2520';
    ctx.lineWidth = isC ? 1.2:1;
    ctx.beginPath();
    ctx.moveTo(40,y);
    ctx.lineTo(w-6,y);
    ctx.stroke();
    ctx.fillStyle = isC ? '#c9bfa8' : '#5f574a';
    ctx.fillText(noteNameFromMidi(m), 4, y+4);
  }

  const xFor = (t) => w - ((nowT - t)/WINDOW_SECONDS)*(w-40) ;

  ctx.strokeStyle='#d9a44e';
  ctx.lineWidth=3;
  referenceSegments.forEach(seg=>{
    const y = padTop + midiToY(freqToMidi(seg.freq), minMidi, maxMidi, plotH);
    const x1 = xFor(seg.start), x2 = xFor(seg.end);
    ctx.beginPath();
    ctx.moveTo(Math.max(40,x1), y);
    ctx.lineTo(Math.min(w,x2), y);
    ctx.stroke();
  });

  ctx.strokeStyle='#5fcfc2';
  ctx.lineWidth=2.4;
  ctx.beginPath();
  let drawing=false;
  let prevMidi=null, prevT=null;
  userPoints.forEach(p=>{
    const x = xFor(p.t);
    if(x<40 || x>w){ return; }
    if(p.freq===null){ drawing=false; prevMidi=null; prevT=null; return; }
    const midi = freqToMidi(p.freq);
    const y = padTop + midiToY(midi,minMidi,maxMidi,plotH);
    const discontinuity = prevMidi!==null && (
      Math.abs((midi-prevMidi)*100)>BIG_JUMP_CENTS ||
      (prevT!==null && p.t-prevT>0.18)
    );
    if(!drawing || discontinuity){ ctx.moveTo(x,y); drawing=true; }
    else{ ctx.lineTo(x,y); }
    prevMidi=midi;
    prevT=p.t;
  });
  ctx.stroke();

  ctx.strokeStyle='#d9a44e';
  ctx.globalAlpha=0.5;
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(w-6,0);
  ctx.lineTo(w-6,h);
  ctx.stroke();
  ctx.globalAlpha=1;
}
</script>

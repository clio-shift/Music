<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frets to Notes — Games</title>
<style>
  :root{
    --bg:#f5f5f4; --card:#fff; --gold:#c27620; --gold2:#ead9b1;
    --text:#222; --muted:#777;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;
    color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:30px 16px;
  }
  .wrap{max-width:480px;width:100%}
  .title{font-size:28px;font-weight:700;text-align:center;margin-bottom:6px}
  .subtitle{text-align:center;color:var(--muted);font-size:15px;margin-bottom:32px}
  .card{
    display:block;background:var(--card);border:1px solid #e5dcc6;border-radius:16px;
    padding:22px 20px;margin-bottom:16px;text-decoration:none;color:inherit;
    transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .card:hover{border-color:var(--gold);box-shadow:0 4px 12px rgba(194,118,32,.12);transform:translateY(-1px)}
  .card-emoji{font-size:26px;margin-bottom:8px}
  .card-name{font-size:19px;font-weight:700;margin-bottom:4px}
  .card-desc{font-size:14px;color:var(--muted);line-height:1.4}
  .footer{text-align:center;color:#aaa;font-size:12px;margin-top:28px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="title">🎸 Frets to Notes</div>
    <div class="subtitle">Pick a game to practice</div>
    <a class="card" href="frets-to-notes.html">
      <div class="card-emoji">🎯</div>
      <div class="card-name">Note Hunt — Reverse</div>
      <div class="card-desc">See a fret/string position and identify the note.</div>
    </a>
    <a class="card" href="interval-trainer.html">
      <div class="card-emoji">🎵</div>
      <div class="card-name">Interval Trainer</div>
      <div class="card-desc">Practice recognizing intervals on the fretboard.</div>
    </a>
    <a class="card" href="interval%20hunt.html">
      <div class="card-emoji">🎯</div>
      <div class="card-name">Interval Hunt</div>
      <div class="card-desc">Ear-training game — hear or see two notes and name the interval.</div>
    </a>
    <div class="footer">Standard tuning · E A D G B E</div>
  </div>
</body>
</html>

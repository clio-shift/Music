<!doctype html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>标准音目标音</title><style>
:root{--bg:#f5f5f4;--card:#fff;--gold:#c27620;--ok:#4d8a5f;--bad:#ad4b45}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,"Microsoft YaHei",sans-serif;color:#222}.app{max-width:680px;margin:auto;padding:28px 16px 60px}.header{display:flex;gap:14px;align-items:center}.back{font-size:28px;color:#666;text-decoration:none}.top{flex:1}.title{font-size:23px;font-weight:700}.sub,.score{font-size:14px;color:#777}.score{text-align:right}.score b{font-size:20px;color:var(--gold)}.progress{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:24px}.dot{height:8px;border-radius:9px;background:#dfd8ca}.dot.current{background:var(--gold)}.dot.correct{background:var(--ok)}.dot.wrong{background:var(--bad)}.prompt,.settings{background:var(--card);border:1px solid #e5dcc6;border-radius:15px;margin-top:16px;padding:25px;text-align:center;box-shadow:0 1px 3px #0000000a}.question{color:#777}..listen{font-size:46px;color:var(--gold);margin:20px}.hint{color:#555;min-height:24px}.replay,.answer,.new,select{padding:10px;border:1px solid #d2c4aa;border-radius:8px;background:#fff;cursor:pointer}.replay{border-radius:50%;font-size:20px}.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.answer{font-weight:700}.answer:hover{border-color:var(--gold);background:#faf5eb}.answer.correct{background:#dcece0;border-color:var(--ok)}.answer.wrong{background:#f3d8d6;border-color:var(--bad)}.answer:disabled{cursor:default}.setting-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}.setting-row label{font-size:14px;color:#555}.help{font-size:13px;color:#777;line-height:1.6;margin:18px 3px}@media(max-width:500px){.answers{grid-template-columns:repeat(3,1fr)}.app{padding:18px 12px}}
</style></head><body><main class="app"><div class="header"><a class="back" href="index.html">←</a><div class="top"><div class="title">🎯 标准音目标音</div><div class="sub">先听标准音，再听目标音，选出目标音名</div></div><div class="score">得分<br><b id="score">0</b> / <span id="total">20</span></div></div><div id="progress" class="progress"></div><section class="prompt"><div id="ql" class="question">第 1 题 · 听标准音和目标音</div><div class="listen">♫ → ♪</div><div id="hint" class="hint">先播放标准音 A4，再判断目标音</div><button id="replay" class="replay">🔊</button></section><section id="answers" class="answers"></section><section class="settings"><div class="setting-row"><label>题数 <select id="round"><option>10</option><option selected>20</option><option>30</option><option>50</option></select></label><label>音色 <select id="instrument"><option value="random" selected>随机（全部音色）</option><option value="piano">钢琴</option><option value="guitar">吉他</option><option value="violin">小提琴</option><option value="flute">长笛</option><option value="synth">合成器</option></select></label><label><input type="radio" name="mode" value="once">只播放一次</label><label><input type="radio" name="mode" value="loop" checked>循环播放</label><label>间隔 <select id="delay"><option selected>1</option><option>2</option><option>3</option></select> 秒</label><label>音量 <input id="volume" type="range" min="0" max="250" value="150"></label><button id="restart" class="new">重新开始</button></div></section><div class="help">每题以标准音 A4（440Hz）作为参照，随后播放一个目标音。目标音范围为 C4–C5，选择对应音名；循环播放会持续到答对，点击正确答案自动进入下一题。</div></main><script>
const names=['C','C♯/D♭','D','D♯/E♭','E','F','F♯/G♭','G','G♯/A♭','A','A♯/B♭','B'], keys=['piano','guitar','violin','flute','synth'];let qs=[],i=0,score=0,locked=false,timer=null,sources=[],ctx,bus;const presets={piano:['triangle',.65,.012],guitar:['triangle',.7,.008],violin:['sawtooth',.68,.12],flute:['sine',.62,.08],synth:['square',.65,.01]};
function audio(){if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();bus=ctx.createGain();bus.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume();return ctx}function tone(m,at,key){const c=audio(),p=presets[key]||presets.piano,t=c.currentTime+at,v=+volume.value/100,g=c.createGain(),o=c.createOscillator();o.type=p[0];o.frequency.value=440*Math.pow(2,(m-69)/12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.45*v,t+p[2]);g.gain.exponentialRampToValueAtTime(.0001,t+p[1]);o.connect(g);g.connect(bus);o.start(t);o.stop(t+p[1]+.05);sources.push(o)}function stop(){if(timer)clearTimeout(timer);timer=null;sources.splice(0).forEach(o=>{try{o.stop()}catch(e){}})}function play(){stop();const q=qs[i],gap=.9;tone(69,0,q.key);tone(q.midi,.9,q.key);if(document.querySelector('[name=mode]:checked').value==='loop'&&!locked)timer=setTimeout(play,(1.8+(+delay.value))*1000)}function build(){progress.innerHTML='';for(let n=0;n<qs.length;n++){const d=document.createElement('div');d.className='dot '+(n===i?'current ':'')+(qs[n].result||'');progress.appendChild(d)}answers.innerHTML='';names.forEach((n,k)=>{const b=document.createElement('button');b.className='answer';b.textContent=n;b.onclick=()=>answer(k);answers.appendChild(b)})}function answer(k){if(locked)return;const q=qs[i],bs=[...answers.children];if(k!==q.target){bs[k].disabled=true;bs[k].classList.add('wrong');hint.textContent='再听一次，继续选择目标音';play();return}locked=true;stop();bs[k].classList.add('correct');q.result='correct';score++;document.getElementById('score').textContent=score;build();setTimeout(()=>{i++;locked=false;if(i<qs.length){show()}else{ql.textContent='本组完成！';hint.textContent=`你答对了 ${score} / ${qs.length} 题`;answers.querySelectorAll('button').forEach(b=>b.disabled=true)}},650)}function show(){locked=false;ql.textContent=`第 ${i+1} 题 · 听标准音和目标音`;hint.textContent='先播放标准音 A4，再判断目标音';build();setTimeout(play,180)}function restart(){stop();const n=+round.value,mode=instrument.value;qs=Array.from({length:n},()=>{const midi=60+Math.floor(Math.random()*13);return{midi,target:midi-60,key:mode==='random'?keys[Math.floor(Math.random()*keys.length)]:mode}});i=score=0;total.textContent=n;show()}replay.onclick=()=>{if(i<qs.length)play()};restart.addEventListener('click',restart);round.onchange=restart;instrument.onchange=restart;document.querySelectorAll('[name=mode]').forEach(x=>x.onchange=restart);delay.onchange=()=>{if(document.querySelector('[name=mode]:checked').value==='loop')play()};restart();
// 音程标签：在每个选项下显示与 A4 的半音距离
const intervalNames=['根音','小二度','大二度','小三度','大三度','纯四度','增四度/减五度','纯五度','小六度','大六度','小七度','大七度'];
const originalBuild=build;build=function(){originalBuild();[...answers.children].forEach((b,k)=>{const s=document.createElement('small');s.textContent=intervalNames[Math.abs(k-9)]||'';s.style.display='block';s.style.fontWeight='400';s.style.color='#888';b.appendChild(s)})};
</script></body></html>
